name: CI

on:
  push:
  pull_request:

jobs:
  build-book:
    name: Build Interactive Jupyter Books (/tutorials & /ssc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Jupyter Book
        run: pip install -r book/requirements.txt
      - name: Build both books for Netlify subpaths (/tutorials and /ssc)
        run: |
          jupyter-book build book/
          jupyter-book build ssc/
          rm -rf publish
          mkdir -p publish/tutorials publish/ssc
          cp -R book/_build/html/. publish/tutorials/
          cp -R ssc/_build/html/. publish/ssc/
      - name: Verify generated chapters and editable Thebe assets
        run: |
          # ODE Modelling Tutorials (/tutorials)
          test -f publish/tutorials/index.html
          test -f publish/tutorials/tutorial-1/01-running-the-toy-model.html
          test -f publish/tutorials/tutorial-1/03-editing-models-challenges.html
          test -f publish/tutorials/tutorial-2/01-modifiers-and-induction.html
          test -f publish/tutorials/tutorial-2/02-modifier-challenges.html
          test -f publish/tutorials/_static/mitchell-thebe.js
          test -f publish/tutorials/_static/mitchell-thebe.css
          grep -q "mitchell-thebe.js" publish/tutorials/tutorial-1/01-running-the-toy-model.html

          # BSMS SSC Interactive Book (/ssc)
          test -f publish/ssc/index.html
          test -f publish/ssc/week-1/01-intro-to-modelling.html
          test -f publish/ssc/week-1/02-si-sis-model.html
          test -f publish/ssc/week-1/03-sir-sirs-model.html
          test -f publish/ssc/week-1/04-endemic-sir-model.html
          test -f publish/ssc/week-1/05-seir-model.html
          test -f publish/ssc/signalling/01-nfkb-and-systems-biology.html
          test -f publish/ssc/signalling/02-cll-tri-model-simulation.html
          test -f publish/ssc/signalling/03-waldenstrom-drug-discovery.html
          test -f publish/ssc/cell-fate/01-apoptosis-and-cell-cycle-intro.html
          test -f publish/ssc/cell-fate/02-apoptosis-bcl2-model.html
          test -f publish/ssc/cell-fate/03-cell-cycle-myc-model.html
          test -f publish/ssc/_static/ssc-thebe.js
          test -f publish/ssc/_static/ssc-thebe.css
          grep -q "ssc-thebe.js" publish/ssc/week-1/01-intro-to-modelling.html
          grep -q "ssc-thebe.js" publish/ssc/week-1/02-si-sis-model.html
          grep -q "ssc-thebe.js" publish/ssc/signalling/02-cll-tri-model-simulation.html
          grep -q "ssc-thebe.js" publish/ssc/cell-fate/02-apoptosis-bcl2-model.html
          grep -q "ssc-thebe.js" publish/ssc/cell-fate/03-cell-cycle-myc-model.html

  test-spawner-and-csv2model:
    name: Test Spawner & CSV2Model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spawner & test dependencies
        run: |
          pip install -r server/spawner/requirements.txt pytest pytest-asyncio
      - name: Run spawner integration tests
        run: pytest -v server/spawner/tests/test_spawner.py
      - name: Verify csv2model-multiscale.py produces valid Julia output with zero warnings
        run: |
          python3 -B -W error -m py_compile tutorials/NFkB/csv2Julia/csv2model-multiscale.py
          python3 -B -W error -m py_compile tutorials/apoptosis/csv2model-multiscale.py
          python3 -B -W error -m py_compile tutorials/cellCycle/csv2model-multiscale.py
          TMPDIR="$(mktemp -d)"
          cp -R tutorials/toyModel/. "$TMPDIR/"
          (
            cd "$TMPDIR"
            python3 -B -W error csv2model-multiscale.py reactions.csv parameters.csv ratelaws.csv toyModel.jl
            grep -q "function toyModel(dy,y,p,t)" toyModel.jl
            grep -q 'dy\[1\]= + 1 - A \* 2' toyModel.jl
            grep -q 'syms=\["A","B","C",\]' variableNames.jl
          )
          APOP_DIR="$(mktemp -d)"
          cp -R tutorials/apoptosis/. "$APOP_DIR/"
          (
            cd "$APOP_DIR"
            python3 -B -W error csv2model-multiscale.py reactions_apoptosis.csv parameters_apoptosis.csv rateLaws_apoptosis.csv odeApoptosis.jl scan
            grep -q "function odeApoptosis(dy,y,p,t)" odeApoptosis.jl
            grep -q '"k1_88"=>1.0' scanIncludes.jl
          )
          CC_DIR="$(mktemp -d)"
          cp -R tutorials/cellCycle/. "$CC_DIR/"
          (
            cd "$CC_DIR"
            python3 -B -W error csv2model-multiscale.py reactions_cellCycle.csv parameters_cellCycle.csv rateLaws_cellCycle.csv odeCellCycle.jl scan
            grep -q "function odeCellCycle(dy,y,p,t)" odeCellCycle.jl
            grep -q '"k1_myc"=>1.0' scanIncludes.jl
          )
      - name: Verify server auto-update scripts (syntax & selective rebuild logic)
        run: |
          bash -n server/auto-update/update-tutorial-server.sh
          bash -n server/auto-update/install-systemd-timer.sh
          bash -n server/auto-update/uninstall-systemd-timer.sh
          TEST_ROOT="$(mktemp -d)"
          git init --bare --initial-branch=main "$TEST_ROOT/origin.git" >/dev/null
          git clone "$TEST_ROOT/origin.git" "$TEST_ROOT/work" >/dev/null 2>&1
          (
            cd "$TEST_ROOT/work"
            git config user.email "ci@mitchell.science"
            git config user.name "CI"
            mkdir -p ssc tutorials/toyModel server/spawner
            echo "v1" > ssc/intro.md
            echo "v1" > tutorials/toyModel/reactions.csv
            echo "v1" > server/spawner/app.py
            git add . && git commit -m "init" >/dev/null && git push -u origin main >/dev/null 2>&1
          )
          git clone "$TEST_ROOT/origin.git" "$TEST_ROOT/server_clone" >/dev/null 2>&1
          # 1. Book-only commit should skip Docker
          (
            cd "$TEST_ROOT/work"
            echo "v2" > ssc/intro.md
            git commit -am "book edit" >/dev/null && git push >/dev/null 2>&1
          )
          OUT1="$(REPO_DIR="$TEST_ROOT/server_clone" LOCK_FILE="$TEST_ROOT/lock" bash server/auto-update/update-tutorial-server.sh --dry-run)"
          grep -q "no Docker rebuild needed" <<<"$OUT1"
          git -C "$TEST_ROOT/server_clone" pull --ff-only >/dev/null 2>&1
          # 2. tutorials/ commit should trigger ONLY kernel build
          (
            cd "$TEST_ROOT/work"
            echo "v2" > tutorials/toyModel/reactions.csv
            git commit -am "model edit" >/dev/null && git push >/dev/null 2>&1
          )
          OUT2="$(REPO_DIR="$TEST_ROOT/server_clone" LOCK_FILE="$TEST_ROOT/lock" bash server/auto-update/update-tutorial-server.sh --dry-run)"
          grep -q "docker build -f server/Dockerfile.julia-kernel" <<<"$OUT2"
          ! grep -q "docker compose" <<<"$OUT2"
          git -C "$TEST_ROOT/server_clone" pull --ff-only >/dev/null 2>&1
          # 3. server/spawner/ commit should trigger ONLY spawner rebuild
          (
            cd "$TEST_ROOT/work"
            echo "v2" > server/spawner/app.py
            git commit -am "spawner edit" >/dev/null && git push >/dev/null 2>&1
          )
          OUT3="$(REPO_DIR="$TEST_ROOT/server_clone" LOCK_FILE="$TEST_ROOT/lock" bash server/auto-update/update-tutorial-server.sh --dry-run)"
          grep -q "docker compose up -d --build spawner" <<<"$OUT3"
          ! grep -q "docker build -f server/Dockerfile.julia-kernel" <<<"$OUT3"

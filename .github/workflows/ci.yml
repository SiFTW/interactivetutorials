name: CI

on:
  push:
  pull_request:

jobs:
  build-book:
    name: Build Interactive Jupyter Book (Editable Thebe Cells)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Jupyter Book
        run: pip install -r book/requirements.txt
      - name: Build book for Netlify subpath (/tutorials)
        run: |
          jupyter-book build book/
          rm -rf publish
          mkdir -p publish/tutorials
          cp -R book/_build/html/. publish/tutorials/
      - name: Verify generated chapters and editable Thebe assets
        run: |
          test -f publish/tutorials/index.html
          test -f publish/tutorials/tutorial-1/01-running-the-toy-model.html
          test -f publish/tutorials/tutorial-1/03-editing-models-challenges.html
          test -f publish/tutorials/tutorial-2/01-modifiers-and-induction.html
          test -f publish/tutorials/tutorial-2/02-modifier-challenges.html
          test -f publish/tutorials/_static/mitchell-thebe.js
          test -f publish/tutorials/_static/mitchell-thebe.css
          grep -q "mitchell-thebe.js" publish/tutorials/tutorial-1/01-running-the-toy-model.html

  test-spawner-and-csv2model:
    name: Test Spawner & CSV2Model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spawner & test dependencies
        run: |
          pip install -r server/spawner/requirements.txt pytest pytest-asyncio
      - name: Run spawner integration tests
        run: pytest -v server/spawner/tests/test_spawner.py
      - name: Verify csv2model-multiscale.py produces valid Julia output with zero warnings
        run: |
          TMPDIR="$(mktemp -d)"
          cp tutorials/toyModel/* "$TMPDIR/"
          (
            cd "$TMPDIR"
            python3 -W error csv2model-multiscale.py reactions.csv parameters.csv ratelaws.csv toyModel.jl
            grep -q "function toyModel(dy,y,p,t)" toyModel.jl
            grep -q 'dy\[1\]= + 1 - A \* 2' toyModel.jl
            grep -q 'syms=\["A","B","C",\]' variableNames.jl
          )

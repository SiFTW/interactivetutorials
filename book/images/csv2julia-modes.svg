<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-label="Comparison of CSV2Julia inline, scan, and param execution modes">
  <defs>
    <filter id="sh-mo" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.09"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="852" height="272" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="430" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">The Three Modes of CSV2Julia (5th Command-Line Argument)</text>

  <!-- Card 1: inline -->
  <g filter="url(#sh-mo)">
    <rect x="24" y="54" width="256" height="202" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
    <rect x="24" y="54" width="256" height="36" rx="10" fill="#475569"/>
    <rect x="24" y="78" width="256" height="12" fill="#475569"/>
  </g>
  <text x="152" y="77" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="700" fill="#ffffff">inline  (default)</text>
  <text x="38" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Generated ODE line:</text>
  <rect x="36" y="118" width="232" height="32" rx="6" fill="#f1f5f9"/>
  <text x="46" y="138" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#0f172a">dy[1] = + 1 - A * 2</text>
  <text x="38" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">✓ Very easy to read</text>
  <text x="38" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#b91c1c">✗ Numbers frozen in code</text>
  <text x="38" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#b91c1c">✗ Must rebuild to change values</text>
  <text x="38" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#64748b">Best for: inspecting equations</text>

  <!-- Card 2: scan -->
  <g filter="url(#sh-mo)">
    <rect x="302" y="54" width="256" height="202" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/>
    <rect x="302" y="54" width="256" height="36" rx="10" fill="#8b5cf6"/>
    <rect x="302" y="78" width="256" height="12" fill="#8b5cf6"/>
  </g>
  <text x="430" y="77" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="700" fill="#ffffff">scan</text>
  <text x="316" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Generated ODE + scanIncludes.jl:</text>
  <rect x="314" y="118" width="232" height="32" rx="6" fill="#f5f3ff"/>
  <text x="322" y="138" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#4c1d95">paramFun("k1_Aexp", modify)</text>
  <text x="316" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#334155">✓ Fold-change via Dict:</text>
  <text x="326" y="190" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#6d28d9">modify["k1_Aexp"] = 2.0</text>
  <text x="316" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#b45309">⚠ Global Dict; (t) not in modify</text>
  <text x="316" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic" fill="#64748b">Best for: quick legacy scripts</text>

  <!-- Card 3: param (Recommended) -->
  <g filter="url(#sh-mo)">
    <rect x="580" y="54" width="256" height="202" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2.4"/>
    <rect x="580" y="54" width="256" height="36" rx="10" fill="#0ea5e9"/>
    <rect x="580" y="78" width="256" height="12" fill="#0ea5e9"/>
  </g>
  <text x="708" y="77" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="700" fill="#ffffff">param  ★ Recommended</text>
  <text x="594" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#475569">Generated ODE + scanIncludes.jl:</text>
  <rect x="592" y="118" width="232" height="32" rx="6" fill="#e0f2fe"/>
  <text x="602" y="138" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" fill="#0369a1">dy[1] = + p[1](t) - A * p[2]</text>
  <text x="594" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#15803d">✓ Pass paramVals into ODEProblem</text>
  <text x="594" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#15803d">✓ Swap f(t) curves at runtime!</text>
  <text x="594" y="212" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#15803d">✓ Safe copies for sweeps &amp; cells</text>
  <text x="594" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0284c7">Used in published NFkBModel!</text>
</svg>

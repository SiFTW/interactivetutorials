<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" role="img" aria-label="NFkB and IkB reversible binding and unbinding to form the NFkB_IkB complex">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <filter id="sh-b" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="752" height="207" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- NFkB -->
  <g filter="url(#sh-b)">
    <rect x="68" y="34" width="118" height="54" rx="12" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
  </g>
  <text x="127" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">NFkB</text>

  <!-- Plus sign -->
  <text x="127" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#64748b">+</text>

  <!-- IkB -->
  <g filter="url(#sh-b)">
    <rect x="68" y="128" width="118" height="54" rx="12" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text x="127" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">IkB</text>

  <!-- Binding arrow (top) -->
  <line x1="214" y1="88" x2="466" y2="88" stroke="#0f766e" stroke-width="2.6" marker-end="url(#arr-b)"/>
  <text x="340" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f766e">Binding (2 substrates)</text>
  <text x="340" y="82" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#115e59">[S1] * [S2] * {kon}</text>

  <!-- Unbinding arrow (bottom) -->
  <line x1="474" y1="126" x2="222" y2="126" stroke="#b45309" stroke-width="2.6" marker-end="url(#arr-b)"/>
  <text x="340" y="148" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#b45309">Unbinding (1 substrate → 2 products)</text>
  <text x="340" y="164" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11.5" fill="#92400e">[S1] * {koff}</text>

  <!-- Complex NFkB_IkB -->
  <g filter="url(#sh-b)">
    <rect x="492" y="74" width="196" height="66" rx="14" fill="#10b981" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="590" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">NFkB_IkB</text>
  <text x="590" y="160" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">(sequestered complex)</text>
</svg>

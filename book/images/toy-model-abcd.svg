<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" role="img" aria-label="Extended Toy Model biochemical reaction network with species D: expression of A, A to B, B to C, C to D, and degradation of D">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="872" height="162" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Empty source -->
  <g transform="translate(46, 85)" stroke="#64748b" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="13"/>
    <line x1="-10" y1="10" x2="10" y2="-10"/>
  </g>

  <!-- -> A -->
  <line x1="64" y1="85" x2="132" y2="85" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="98" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#0f766e">k1_Aexp</text>

  <!-- A -->
  <g filter="url(#shadow2)">
    <rect x="140" y="55" width="72" height="60" rx="11" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
  </g>
  <text x="176" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#ffffff">A</text>

  <!-- A -> B -->
  <line x1="218" y1="85" x2="288" y2="85" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="253" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#0369a1">k1_AtoB</text>

  <!-- B -->
  <g filter="url(#shadow2)">
    <rect x="296" y="55" width="72" height="60" rx="11" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text x="332" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#ffffff">B</text>

  <!-- B -> C -->
  <line x1="374" y1="85" x2="444" y2="85" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="409" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#6d28d9">k1_BtoC</text>

  <!-- C -->
  <g filter="url(#shadow2)">
    <rect x="452" y="55" width="72" height="60" rx="11" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="488" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#ffffff">C</text>

  <!-- C -> D (NEW!) -->
  <line x1="530" y1="85" x2="608" y2="85" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="569" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" fill="#059669">k1_CtoD</text>
  <text x="569" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#059669">NEW</text>

  <!-- D (NEW!) -->
  <g filter="url(#shadow2)">
    <rect x="616" y="55" width="72" height="60" rx="11" fill="#10b981" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="652" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#ffffff">D</text>

  <!-- D -> nothing -->
  <line x1="694" y1="85" x2="808" y2="85" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="751" y="65" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#047857">k1_Ddeg</text>

  <!-- Empty sink -->
  <g transform="translate(834, 85)" stroke="#64748b" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="13"/>
    <line x1="-10" y1="10" x2="10" y2="-10"/>
  </g>
</svg>

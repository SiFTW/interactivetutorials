<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Diagram of how callbacks control steady state, cell division, daughter spawning, and apoptosis death in the multiscale lineage simulation">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="400" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="480" y="34" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0f172a">
    How Callbacks Turn One ODE System into a Dividing, Dying Cell Lineage
  </text>
  <text x="480" y="55" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#475569">
    Each simulated cell runs the 193-species ODE until a ContinuousCallback tripwire fires
  </text>

  <!-- Phase 1 Box -->
  <rect x="26" y="84" width="210" height="178" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="131" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#1d4ed8">Phase 1: Pre-Simulation</text>
  <text x="131" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e40af">(24 h resting steady state)</text>
  <text x="131" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">• Basal IKK, death ligand L = 0</text>
  <text x="131" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">• Bcl2t &amp; differentiation clamped</text>
  <text x="131" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">• Cell-specific parameters</text>
  <text x="131" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">(preCV = 0.11 across 105 rates)</text>
  <text x="131" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">Callback halves Mass in place</text>
  <text x="131" y="251" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#1e40af">(no daughters spawned yet)</text>

  <!-- Arrow Phase 1 -> Phase 2 -->
  <line x1="236" y1="172" x2="278" y2="172" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="257" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#334155">t = 0</text>
  <text x="257" y="191" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">L = 1</text>

  <!-- Phase 2 Core Solver Box -->
  <rect x="282" y="84" width="234" height="178" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2"/>
  <text x="399" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Phase 2: Active Cell ODE</text>
  <text x="399" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">(t_birth → 120 h, Gen g)</text>
  <text x="399" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">• Dynamic IKK curve active</text>
  <text x="399" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">• NIK stabilised (deg ÷ 10)</text>
  <text x="399" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0f172a">• RB switch callback toggles r31</text>
  <rect x="300" y="210" width="198" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="399" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Race between two fates:</text>
  <text x="399" y="241" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Which callback fires first?</text>

  <!-- Branch A: Division Callback -->
  <path d="M 516 140 L 558 140" fill="none" stroke="#15803d" stroke-width="2.4" marker-end="url(#arrow-green)"/>
  <rect x="562" y="76" width="376" height="114" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#15803d">Callback 1: Division Wins (fate = 1)</text>
  <text x="750" y="119" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#14532d">Condition: Cdh1 crosses 0.2 upwards AND Mass ≥ 1.0</text>
  <text x="750" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#1e293b">1. Call terminate!(integrator) at division time t_div</text>
  <text x="750" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#1e293b">2. Halve Mass (×0.5), reset Cdh1 = 1, CPARP = 0</text>
  <text x="750" y="177" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="600" fill="#15803d">3. Spawn Gen g+1 daughter (2^g cells when divCV = 0)</text>

  <!-- Loop back arrow from Division to Phase 2 -->
  <path d="M 750 76 L 750 64 L 399 64 L 399 80" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>

  <!-- Branch B: Apoptosis Callback -->
  <path d="M 516 218 L 558 218" fill="none" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrow-red)"/>
  <rect x="562" y="206" width="376" height="84" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="750" y="229" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#b91c1c">Callback 2: Apoptosis Wins (fate = 2)</text>
  <text x="750" y="249" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#7f1d1d">Condition: Cleaved PARP (CPARP) crosses 2500</text>
  <text x="750" y="270" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#1e293b">Call terminate!(integrator) — lineage branch ends (×)</text>

  <!-- Bottom lineage tree illustration -->
  <rect x="26" y="308" width="908" height="72" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Example Lineage Tree (divCV = 0):</text>

  <!-- Gen 1 -->
  <line x1="270" y1="344" x2="410" y2="344" stroke="#2563eb" stroke-width="3"/>
  <text x="340" y="336" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#1d4ed8">Gen 1 (1 cell)</text>
  <!-- Split 1 -->
  <line x1="410" y1="328" x2="410" y2="360" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="410" y1="328" x2="565" y2="328" stroke="#16a34a" stroke-width="2.8"/>
  <line x1="410" y1="360" x2="565" y2="360" stroke="#16a34a" stroke-width="2.8"/>
  <text x="487" y="322" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#15803d">Gen 2 (2 cells)</text>
  <!-- Split 2 -->
  <line x1="565" y1="320" x2="565" y2="336" stroke="#9333ea" stroke-width="2.2"/>
  <line x1="565" y1="352" x2="565" y2="368" stroke="#9333ea" stroke-width="2.2"/>
  <line x1="565" y1="320" x2="725" y2="320" stroke="#9333ea" stroke-width="2.4"/>
  <line x1="565" y1="336" x2="725" y2="336" stroke="#9333ea" stroke-width="2.4"/>
  <line x1="565" y1="352" x2="725" y2="352" stroke="#9333ea" stroke-width="2.4"/>
  <line x1="565" y1="368" x2="725" y2="368" stroke="#9333ea" stroke-width="2.4"/>
  <text x="645" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#7c3aed">Gen 3 (4 cells)</text>
  <!-- Death crosses -->
  <text x="735" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626">×</text>
  <text x="735" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626">×</text>
  <text x="735" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626">×</text>
  <text x="735" y="372" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#dc2626">×</text>
  <text x="762" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#991b1b">All 4 die via CPARP</text>
  <text x="48" y="356" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Summing 2^(g-1) across N founder</text>
  <text x="48" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">lineages gives total live tumour cells.</text>
</svg>

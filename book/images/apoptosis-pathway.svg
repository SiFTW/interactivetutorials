<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 334" role="img" aria-label="Apoptosis signalling pathway showing BCL2 inhibition of MOMP and PARP cleavage">
  <defs>
    <marker id="arrAp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrRedAp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="960" height="334" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Apoptosis Decision Circuit (Albeck et al. / Norris et al., 2024)</text>

  <!-- Step 1: Death Ligand & DISC -->
  <rect x="24" y="96" width="132" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="90" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0c4a6e">Death Signal</text>
  <text x="90" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#0369a1">L → DISC → C8</text>

  <!-- FLIP inhibition on DISC -->
  <rect x="46" y="218" width="88" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="90" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400e">FLIP</text>
  <line x1="90" y1="216" x2="90" y2="165" stroke="#d97706" stroke-width="2.5"/>
  <line x1="80" y1="165" x2="100" y2="165" stroke="#d97706" stroke-width="3"/>

  <line x1="158" y1="127" x2="190" y2="127" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrAp)"/>

  <!-- Step 2: Bid -> tBid -->
  <rect x="196" y="96" width="118" height="62" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="255" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#9a3412">BID → tBid</text>
  <text x="255" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#c2410c">BH3 activator</text>

  <line x1="316" y1="127" x2="348" y2="127" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrAp)"/>

  <!-- Step 3: BAX / MOMP hub (Mitochondria) -->
  <rect x="354" y="76" width="194" height="102" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="451" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#991b1b">BAX → MOMP</text>
  <text x="451" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" fill="#7f1d1d">Mitochondrial pore</text>
  <text x="451" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" fill="#7f1d1d">Point of no return</text>
  <text x="451" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#b91c1c">Releases Cyto c &amp; SMAC</text>

  <!-- BCL2 inhibition (Cancer Oncogene highlight) -->
  <rect x="350" y="220" width="202" height="58" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
  <text x="451" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#7f1d1d">BCL2 / Bcl2c</text>
  <text x="451" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#991b1b">Overexpressed in DLBCL</text>
  <line x1="451" y1="218" x2="451" y2="184" stroke="#b91c1c" stroke-width="3"/>
  <line x1="439" y1="184" x2="463" y2="184" stroke="#b91c1c" stroke-width="3.5"/>
  <text x="467" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Blocks MOMP</text>

  <line x1="550" y1="127" x2="584" y2="127" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRedAp)"/>

  <!-- Step 4: Apoptosome & Caspase-3 -->
  <rect x="590" y="96" width="154" height="62" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="667" y="122" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#4c1d95">Caspase-9 → C3</text>
  <text x="667" y="142" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#6d28d9">Executioner switch</text>

  <!-- XIAP & SMAC -->
  <rect x="619" y="218" width="96" height="38" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="667" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#92400e">XIAP</text>
  <line x1="667" y1="216" x2="667" y2="165" stroke="#d97706" stroke-width="2.5"/>
  <line x1="657" y1="165" x2="677" y2="165" stroke="#d97706" stroke-width="3"/>
  <text x="681" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#92400e">Blocked by SMAC</text>

  <line x1="746" y1="127" x2="780" y2="127" stroke="#dc2626" stroke-width="3" marker-end="url(#arrRedAp)"/>

  <!-- Step 5: Cleaved PARP (Readout) -->
  <rect x="786" y="90" width="150" height="74" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
  <text x="861" y="118" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">Cleaved PARP</text>
  <text x="861" y="138" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#fca5a5">(CPARP &gt; 10%)</text>
  <text x="861" y="156" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#cbd5e1">Cell Death Readout</text>

  <!-- Footer legend -->
  <text x="480" y="314" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#475569">Arrows (→) = activation / pore formation   ·   Flat bars (⊣) = inhibition (BCL2, XIAP, FLIP)</text>
</svg>

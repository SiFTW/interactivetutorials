<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 165" role="img" aria-label="Incorrect diagram showing NFkB as a substrate turning into IkB">
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b91c1c"/>
    </marker>
    <filter id="sh-w" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="732" height="157" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>

  <!-- Badge -->
  <rect x="20" y="16" width="244" height="24" rx="12" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="142" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">✗ Incorrect: consumes NFkB</text>

  <!-- Source -->
  <g transform="translate(62, 92)" stroke="#64748b" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="13"/>
    <line x1="-10" y1="10" x2="10" y2="-10"/>
  </g>
  <line x1="80" y1="92" x2="156" y2="92" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-red)"/>

  <!-- NFkB -->
  <g filter="url(#sh-w)">
    <rect x="164" y="62" width="112" height="60" rx="12" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
  </g>
  <text x="220" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">NFkB</text>

  <!-- NFkB -> IkB (WRONG) -->
  <line x1="282" y1="92" x2="438" y2="92" stroke="#b91c1c" stroke-width="2.8" stroke-dasharray="7 4" marker-end="url(#arr-red)"/>
  <text x="360" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#991b1b">Turns NFkB into IkB?</text>
  <text x="360" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7f1d1d">(NFkB gets used up!)</text>

  <!-- IkB -->
  <g filter="url(#sh-w)">
    <rect x="446" y="62" width="112" height="60" rx="12" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text x="502" y="99" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">IkB</text>

  <!-- IkB -> sink -->
  <line x1="564" y1="92" x2="640" y2="92" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-red)"/>
  <g transform="translate(664, 92)" stroke="#64748b" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="13"/>
    <line x1="-10" y1="10" x2="10" y2="-10"/>
  </g>
</svg>

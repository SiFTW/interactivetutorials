<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" role="img" aria-label="Correct modifier diagrams showing promotion (circle on a stick) for NFkB promoting IkB expression, and inhibition (flat T-bar) for A inhibiting B expression">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <filter id="sh-c" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Left Panel: Promotion (NFkB promotes IkB expression) -->
  <rect x="4" y="4" width="446" height="222" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="18" y="16" width="248" height="24" rx="12" fill="#dcfce7" stroke="#86efac"/>
  <text x="142" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#166534">✓ Promotion (modifier points to arrow)</text>

  <!-- NFkB node at top -->
  <g filter="url(#sh-c)">
    <rect x="128" y="54" width="110" height="50" rx="11" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
  </g>
  <text x="183" y="86" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">NFkB</text>

  <!-- Promotion stick + open/filled circle pointing to reaction arrow -->
  <line x1="183" y1="104" x2="183" y2="162" stroke="#15803d" stroke-width="2.5"/>
  <circle cx="183" cy="166" r="6" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="242" y="138" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#15803d">promotes</text>
  <text x="242" y="152" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#166534">(not consumed!)</text>

  <!-- Empty source -> IkB -->
  <g transform="translate(64, 178)" stroke="#64748b" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="13"/>
    <line x1="-10" y1="10" x2="10" y2="-10"/>
  </g>
  <line x1="82" y1="178" x2="294" y2="178" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-dark)"/>
  <text x="183" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">IkB expression reaction</text>

  <!-- IkB node -->
  <g filter="url(#sh-c)">
    <rect x="304" y="150" width="110" height="54" rx="11" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text x="359" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">IkB</text>

  <!-- Right Panel: Inhibition (A inhibits B expression) -->
  <rect x="466" y="4" width="310" height="222" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  <rect x="480" y="16" width="196" height="24" rx="12" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="578" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">Inhibition (flat T-bar)</text>

  <!-- Node A -->
  <g filter="url(#sh-c)">
    <rect x="546" y="54" width="76" height="50" rx="11" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="584" y="86" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">A</text>

  <!-- T-bar inhibition -->
  <line x1="584" y1="104" x2="584" y2="166" stroke="#b45309" stroke-width="2.5"/>
  <line x1="572" y1="166" x2="596" y2="166" stroke="#b45309" stroke-width="3.2"/>
  <text x="602" y="138" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#b45309">inhibits</text>

  <!-- Empty source -> B -->
  <g transform="translate(506, 178)" stroke="#64748b" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="12"/>
    <line x1="-9" y1="9" x2="9" y2="-9"/>
  </g>
  <line x1="524" y1="178" x2="660" y2="178" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-dark)"/>
  <text x="584" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">B expression slows</text>

  <!-- Node B -->
  <g filter="url(#sh-c)">
    <rect x="668" y="150" width="76" height="54" rx="11" fill="#10b981" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="706" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">B</text>
</svg>

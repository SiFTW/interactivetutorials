<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 265" role="img" aria-label="NFkB transcriptionally induces IkB mRNA, which translates into IkB protein, with degradation of both mRNA and protein">
  <defs>
    <marker id="arr-m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <filter id="sh-m" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="812" height="257" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- NFkB (top left) -->
  <g filter="url(#sh-m)">
    <rect x="92" y="24" width="116" height="52" rx="11" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
  </g>
  <text x="150" y="57" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff">NFkB</text>

  <!-- NFkB promotes IkB_mRNA synthesis -->
  <line x1="150" y1="76" x2="150" y2="128" stroke="#15803d" stroke-width="2.5"/>
  <circle cx="150" cy="132" r="6" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="164" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#15803d">induces transcription</text>

  <!-- Source -> IkB_mRNA -->
  <g transform="translate(56, 146)" stroke="#64748b" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="12"/>
    <line x1="-9" y1="9" x2="9" y2="-9"/>
  </g>
  <line x1="74" y1="146" x2="236" y2="146" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-m)"/>

  <!-- IkB_mRNA -->
  <g filter="url(#sh-m)">
    <rect x="246" y="118" width="144" height="56" rx="12" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="318" y="153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#ffffff">IkB_mRNA</text>

  <!-- IkB_mRNA degradation (downward) -->
  <line x1="318" y1="174" x2="318" y2="216" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-m)"/>
  <g transform="translate(318, 236)" stroke="#64748b" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="11"/>
    <line x1="-8" y1="8" x2="8" y2="-8"/>
  </g>
  <text x="336" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">mRNA decay</text>

  <!-- IkB_mRNA promotes IkB protein translation (single clean right-angled line) -->
  <path d="M 390 146 L 486 146 L 486 178" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="486" cy="184" r="6" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
  <text x="498" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#15803d">promotes translation</text>

  <!-- Source -> IkB protein -->
  <g transform="translate(422, 198)" stroke="#64748b" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="12"/>
    <line x1="-9" y1="9" x2="9" y2="-9"/>
  </g>
  <line x1="440" y1="198" x2="574" y2="198" stroke="#334155" stroke-width="2.5" marker-end="url(#arr-m)"/>

  <!-- IkB protein -->
  <g filter="url(#sh-m)">
    <rect x="584" y="170" width="112" height="56" rx="12" fill="#8b5cf6" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text x="640" y="205" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#ffffff">IkB</text>

  <!-- IkB degradation -->
  <line x1="696" y1="198" x2="758" y2="198" stroke="#334155" stroke-width="2.2" marker-end="url(#arr-m)"/>
  <g transform="translate(778, 198)" stroke="#64748b" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="11"/>
    <line x1="-8" y1="8" x2="8" y2="-8"/>
  </g>
  <text x="738" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#64748b">decay</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Targeted drug rescue strategies with BTK inhibition versus NIK inhibition">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="inh-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <line x1="8" y1="1" x2="8" y2="9" stroke="#dc2626" stroke-width="2.5"/>
    </marker>
  </defs>

  <rect width="900" height="320" rx="14" fill="#f8fafc"/>
  <text x="450" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    Overcoming Microenvironment-Driven BH3-Mimetic Resistance (Vareli et al., Figs. 6 &amp; 8)
  </text>

  <!-- Strategy 1: BTK Inhibition -->
  <rect x="22" y="50" width="416" height="248" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="22" y="50" width="416" height="34" rx="12" fill="#dbeafe"/>
  <rect x="22" y="72" width="416" height="12" fill="#dbeafe"/>
  <text x="230" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#1e40af">
    Strategy A: Low-Dose BTK Inhibition (Ibrutinib)
  </text>

  <rect x="42" y="98" width="150" height="44" rx="7" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="117" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">Basal BCR / BTK</text>
  <text x="117" y="133" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">High in SUDHL8</text>

  <rect x="242" y="98" width="176" height="44" rx="7" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="330" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Ibrutinib (0.1 µM)</text>
  <text x="330" y="133" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#7f1d1d">Blocks basal BCR signal</text>
  <line x1="242" y1="120" x2="196" y2="120" stroke="#dc2626" stroke-width="2.2" marker-end="url(#inh-red)"/>

  <line x1="117" y1="142" x2="117" y2="174" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-b)"/>

  <rect x="42" y="176" width="376" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="56" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Mechanistic Consequence in SUDHL8 + CD40L:</text>
  <text x="56" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• RelA drops → p100 / IκBδ trap never accumulates</text>
  <text x="56" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• CD40L cannot release cRel:p50 → MCL1 stays low</text>
  <text x="56" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">• Re-sensitises SUDHL8 to BCL-xL inhibitor (A1331852)</text>

  <!-- Strategy 2: NIK Inhibition -->
  <rect x="462" y="50" width="416" height="248" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="462" y="50" width="416" height="34" rx="12" fill="#ede9fe"/>
  <rect x="462" y="72" width="416" height="12" fill="#ede9fe"/>
  <text x="670" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#5b21b6">
    Strategy B: Non-Canonical NIK Inhibition (Amgen16)
  </text>

  <rect x="482" y="98" width="150" height="44" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="557" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">CD40L → NIK</text>
  <text x="557" y="133" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#475569">Active in ALL cell lines</text>

  <rect x="682" y="98" width="176" height="44" rx="7" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="770" y="117" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#b91c1c">Amgen16 / CW15337</text>
  <text x="770" y="133" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#7f1d1d">Blocks NIK / p100 processing</text>
  <line x1="682" y1="120" x2="636" y2="120" stroke="#dc2626" stroke-width="2.2" marker-end="url(#inh-red)"/>

  <line x1="557" y1="142" x2="557" y2="174" stroke="#334155" stroke-width="1.8" marker-end="url(#arr-b)"/>

  <rect x="482" y="176" width="376" height="104" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="496" y="198" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Mechanistic Consequence Across RIVA &amp; SUDHL8:</text>
  <text x="496" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• Blocks p100 → p52 → RelB:p52 &amp; BCL-xL stay low</text>
  <text x="496" y="238" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">• Keeps IκBδ traps intact → cRel:p50 &amp; MCL1 stay low</text>
  <text x="496" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#6d28d9">• Blocks BOTH RelB/BCL-xL &amp; cRel/MCL1 escape routes</text>
</svg>

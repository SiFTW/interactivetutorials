# Netlify configuration for SiFTW/interactivetutorials.
#
# Builds Jupyter Book 1 (Sphinx + Thebe 0.9 editable CodeMirror cells) into
# publish/tutorials/ so MitchellLabWebsite (https://mitchell.science) can
# cleanly reverse-proxy /tutorials/* to this Netlify site.
# See netlify-integration/mitchell-lab-website-patch.md for the matching rule.

[build]
  command = "pip install -r book/requirements.txt && jupyter-book build book/ && rm -rf publish && mkdir -p publish/tutorials && cp -R book/_build/html/. publish/tutorials/"
  publish = "publish"

[build.environment]
  PYTHON_VERSION = "3.12"

[[redirects]]
  from = "/"
  to = "/tutorials/"
  status = 301
  force = true

[[headers]]
  for = "/tutorials/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

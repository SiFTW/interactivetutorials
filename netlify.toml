# Netlify configuration for SiFTW/interactivetutorials.
#
# Builds BOTH Jupyter Book 1 sites (Sphinx + Thebe 0.9 editable CodeMirror cells):
#   - book/ -> publish/tutorials/   (proxied at https://mitchell.science/tutorials/)
#   - ssc/  -> publish/ssc/         (proxied at https://mitchell.science/ssc/)
# See netlify-integration/mitchell-lab-website-patch.md for the matching Netlify proxy rules.

[build]
  command = "pip install -r book/requirements.txt && jupyter-book build book/ && jupyter-book build ssc/ && rm -rf publish && mkdir -p publish/tutorials publish/ssc && cp -R book/_build/html/. publish/tutorials/ && cp -R ssc/_build/html/. publish/ssc/"
  publish = "publish"

[build.environment]
  PYTHON_VERSION = "3.12"

[[redirects]]
  from = "/"
  to = "/tutorials/"
  status = 301
  force = true

[[headers]]
  for = "/tutorials/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/ssc/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

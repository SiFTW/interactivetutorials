<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" role="img" aria-label="SIR and SIRS compartmental model diagram">
  <defs>
    <marker id="arrowDark2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect width="820" height="240" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Susceptible Box -->
  <rect x="40" y="106" width="180" height="90" rx="14" fill="#65a30d" stroke="#4d7c0f" stroke-width="2.5"/>
  <text x="130" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Susceptible</text>
  <text x="130" y="174" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" font-weight="700" fill="#ecfccb">S</text>

  <!-- Infectious Box -->
  <rect x="320" y="106" width="180" height="90" rx="14" fill="#ea580c" stroke="#c2410c" stroke-width="2.5"/>
  <text x="410" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Infectious</text>
  <text x="410" y="174" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" font-weight="700" fill="#ffedd5">I</text>

  <!-- Recovered Box -->
  <rect x="600" y="106" width="180" height="90" rx="14" fill="#2563eb" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="690" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Recovered</text>
  <text x="690" y="174" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-style="italic" font-weight="700" fill="#dbeafe">R</text>

  <!-- S -> I arrow -->
  <line x1="223" y1="151" x2="311" y2="151" stroke="#1e293b" stroke-width="3" marker-end="url(#arrowDark2)"/>
  <text x="270" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-style="italic" font-weight="700" fill="#0f172a">r · β</text>
  <text x="270" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569">Infection</text>
  <text x="270" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569">rate</text>

  <!-- I -> R arrow -->
  <line x1="503" y1="151" x2="591" y2="151" stroke="#1e293b" stroke-width="3" marker-end="url(#arrowDark2)"/>
  <text x="550" y="138" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-style="italic" font-weight="700" fill="#0f172a">γ</text>
  <text x="550" y="178" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569">Recovery</text>
  <text x="550" y="195" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#475569">rate</text>

  <!-- Dashed R -> S waning immunity (SIRS) -->
  <path d="M 690 104 C 690 28, 130 28, 130 98" fill="none" stroke="#1e293b" stroke-width="2.8" stroke-dasharray="10,7" marker-end="url(#arrowDark2)"/>
  <text x="410" y="32" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-style="italic" font-weight="700" fill="#0f172a">ε</text>
  <text x="410" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#475569">Loss of immunity (ε = 0 for SIR; ε &gt; 0 for SIRS)</text>
</svg>

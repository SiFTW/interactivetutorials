<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-label="Rugged protein potential energy landscape illustrating local minima traps, energy barriers, and the sampling problem">
  <defs>
    <marker id="arrRedE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrGrnE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="960" height="356" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Energy Landscapes Are Rugged: "The Sampling Problem" in MD</text>

  <!-- Axes -->
  <line x1="88" y1="300" x2="904" y2="300" stroke="#334155" stroke-width="2.5"/>
  <line x1="88" y1="300" x2="88" y2="58" stroke="#334155" stroke-width="2.5"/>
  <text x="496" y="330" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Conformational State (3D Shape of the Protein)</text>
  <text x="44" y="180" text-anchor="middle" transform="rotate(-90 44 180)" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Potential Energy</text>

  <!-- Rugged energy curve -->
  <path d="M 110 124
           C 155 134, 178 224, 232 224
           C 272 224, 294 162, 336 162
           C 376 162, 396 196, 432 196
           C 468 196, 492 104, 536 104
           C 586 104, 606 274, 660 274
           C 710 274, 738 184, 778 184
           C 816 184, 844 148, 882 142"
        fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>

  <!-- Trapped marble in local minimum -->
  <circle cx="232" cy="211" r="12" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <path d="M 212 204 Q 232 228 252 204" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Callout: Local minimum trap -->
  <rect x="104" y="52" width="268" height="60" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="238" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Trapped in a Local Minimum</text>
  <text x="238" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#7f1d1d">Low thermal energy cannot cross hills</text>
  <line x1="232" y1="112" x2="232" y2="192" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRedE)"/>

  <!-- Energy barrier annotation -->
  <line x1="536" y1="106" x2="536" y2="222" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5,4"/>
  <rect x="424" y="52" width="224" height="34" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="536" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">High Energy Barrier (ΔE‡)</text>

  <!-- Global minimum marble -->
  <circle cx="660" cy="261" r="12" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <rect x="704" y="230" width="232" height="58" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="820" y="253" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#14532d">Global Energy Minimum</text>
  <text x="820" y="273" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#166534">True lowest-energy folded state</text>
  <line x1="704" y1="260" x2="679" y2="261" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGrnE)"/>

  <!-- Enhanced sampling note -->
  <rect x="658" y="52" width="282" height="72" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="799" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af">How MD Overcomes Traps:</text>
  <text x="799" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" fill="#1e3a8a">Higher T, longer runs, or enhanced</text>
  <text x="799" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" fill="#1e3a8a">sampling (metadynamics, replica exchange)</text>
</svg>

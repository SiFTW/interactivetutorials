<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" aria-label="Rugged protein potential energy landscape illustrating local minima traps, energy barriers, and the sampling problem">
  <defs>
    <marker id="arrRedE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrGrnE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="920" height="340" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="460" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">Energy Landscapes Are Rugged: "The Sampling Problem" in MD</text>

  <!-- Axes -->
  <line x1="90" y1="286" x2="860" y2="286" stroke="#334155" stroke-width="2.5"/>
  <line x1="90" y1="286" x2="90" y2="56" stroke="#334155" stroke-width="2.5"/>
  <text x="475" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">Conformational State (3D Shape of the Protein)</text>
  <text x="46" y="172" text-anchor="middle" transform="rotate(-90 46 172)" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155">Potential Energy</text>

  <!-- Rugged energy curve -->
  <path d="M 110 100
           C 155 110, 175 210, 225 210
           C 265 210, 285 145, 325 145
           C 365 145, 385 182, 420 182
           C 455 182, 480 86, 525 86
           C 575 86, 595 262, 650 262
           C 700 262, 725 168, 765 168
           C 800 168, 825 112, 850 106"
        fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>

  <!-- Trapped marble in local minimum -->
  <circle cx="225" cy="197" r="12" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <path d="M 205 190 Q 225 214 245 190" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Callout: Local minimum trap -->
  <rect x="112" y="54" width="218" height="58" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="221" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">Trapped in a Local Minimum!</text>
  <text x="221" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#7f1d1d">Low thermal energy can't cross hills</text>
  <line x1="225" y1="112" x2="225" y2="178" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRedE)"/>

  <!-- Energy barrier annotation -->
  <line x1="525" y1="88" x2="525" y2="208" stroke="#d97706" stroke-width="2.5" stroke-dasharray="5,4"/>
  <rect x="434" y="48" width="182" height="32" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="525" y="69" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">High Energy Barrier (ΔE‡)</text>

  <!-- Global minimum marble -->
  <circle cx="650" cy="249" r="12" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <rect x="676" y="218" width="212" height="56" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="782" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#14532d">Global Energy Minimum</text>
  <text x="782" y="259" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#166534">True lowest-energy folded state</text>
  <line x1="676" y1="248" x2="668" y2="249" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrGrnE)"/>

  <!-- Enhanced sampling note -->
  <rect x="650" y="54" width="238" height="62" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="769" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">How MD Overcomes Traps:</text>
  <text x="769" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e3a8a">Higher T, longer runs, or enhanced</text>
  <text x="769" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1e3a8a">sampling (metadynamics, replica exchange)</text>
</svg>

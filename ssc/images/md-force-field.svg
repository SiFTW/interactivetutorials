<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="960" height="408" role="img" aria-label="Anatomy of a Molecular Dynamics force field: bonded interactions (bonds, angles, dihedrals) and non-bonded interactions (electrostatics and van der Waals)">
  <rect width="960" height="408" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">Anatomy of a Force Field: V(r) = V_bonded + V_non-bonded</text>

  <!-- Left container: Bonded Interactions -->
  <rect x="24" y="52" width="530" height="292" rx="12" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
  <rect x="24" y="52" width="530" height="36" rx="12" fill="#e0f2fe"/>
  <text x="289" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0c4a6e">Bonded Interactions (V_bonded) — Covalent "Springs"</text>

  <!-- 1. Bond Stretching -->
  <rect x="38" y="102" width="160" height="226" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="118" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">Bond Stretching</text>
  <polyline points="70,178 82,178 88,166 98,190 108,166 118,190 128,166 138,190 144,178 156,178" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="68" cy="178" r="14" fill="#0284c7" stroke="#0c4a6e" stroke-width="2"/>
  <circle cx="168" cy="178" r="14" fill="#0284c7" stroke="#0c4a6e" stroke-width="2"/>
  <text x="118" y="216" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">distance b</text>
  <text x="118" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">Harmonic spring</text>
  <text x="118" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">around equilibrium b₀</text>
  <rect x="48" y="284" width="140" height="28" rx="6" fill="#eff6ff"/>
  <text x="118" y="302" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1d4ed8">½ K_b (b − b₀)²</text>

  <!-- 2. Angle Bending -->
  <rect x="209" y="102" width="160" height="226" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="289" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">Angle Bending</text>
  <line x1="247" y1="198" x2="289" y2="156" stroke="#475569" stroke-width="3.5"/>
  <line x1="289" y1="156" x2="331" y2="198" stroke="#475569" stroke-width="3.5"/>
  <path d="M 269 176 A 28 28 0 0 0 309 176" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4,2"/>
  <circle cx="247" cy="198" r="12" fill="#0284c7" stroke="#0c4a6e" stroke-width="2"/>
  <circle cx="289" cy="156" r="13" fill="#0ea5e9" stroke="#0c4a6e" stroke-width="2"/>
  <circle cx="331" cy="198" r="12" fill="#0284c7" stroke="#0c4a6e" stroke-width="2"/>
  <text x="289" y="216" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#ea580c">angle θ</text>
  <text x="289" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">Bending penalty</text>
  <text x="289" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">around equilibrium θ₀</text>
  <rect x="219" y="284" width="140" height="28" rx="6" fill="#eff6ff"/>
  <text x="289" y="302" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1d4ed8">½ K_θ (θ − θ₀)²</text>

  <!-- 3. Dihedral / Torsion Rotation -->
  <rect x="380" y="102" width="160" height="226" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
  <text x="460" y="126" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">Torsion / Dihedral</text>
  <line x1="414" y1="196" x2="440" y2="168" stroke="#475569" stroke-width="3.5"/>
  <line x1="440" y1="168" x2="482" y2="168" stroke="#475569" stroke-width="4"/>
  <line x1="482" y1="168" x2="506" y2="196" stroke="#475569" stroke-width="3.5"/>
  <path d="M 454 150 A 18 18 0 1 1 468 185" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <polygon points="471,187 461,189 467,179" fill="#7c3aed"/>
  <circle cx="414" cy="196" r="10" fill="#0284c7" stroke="#0c4a6e" stroke-width="2"/>
  <circle cx="440" cy="168" r="11" fill="#0ea5e9" stroke="#0c4a6e" stroke-width="2"/>
  <circle cx="482" cy="168" r="11" fill="#0ea5e9" stroke="#0c4a6e" stroke-width="2"/>
  <circle cx="506" cy="196" r="10" fill="#0284c7" stroke="#0c4a6e" stroke-width="2"/>
  <text x="460" y="216" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#7c3aed">dihedral φ</text>
  <text x="460" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">Rotation around</text>
  <text x="460" y="264" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">backbone bonds</text>
  <rect x="390" y="284" width="140" height="28" rx="6" fill="#f5f3ff"/>
  <text x="460" y="302" text-anchor="middle" font-family="monospace" font-size="10.2" font-weight="700" fill="#6d28d9">K_φ [1+cos(nφ−δ)]</text>

  <!-- Right container: Non-bonded Interactions -->
  <rect x="570" y="52" width="366" height="292" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <rect x="570" y="52" width="366" height="36" rx="12" fill="#ffedd5"/>
  <text x="753" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.4" font-weight="700" fill="#9a3412">Non-Bonded (V_non-bonded) — Through Space</text>

  <!-- 4. Electrostatics -->
  <rect x="584" y="102" width="338" height="106" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="753" y="124" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.8" font-weight="700" fill="#c2410c">Electrostatic (Coulomb) Forces</text>
  <circle cx="614" cy="166" r="14" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <text x="614" y="171" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff">+</text>
  <line x1="632" y1="166" x2="686" y2="166" stroke="#ea580c" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="659" y="158" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#9a3412">r_ij</text>
  <circle cx="704" cy="166" r="14" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  <text x="704" y="172" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">−</text>
  <text x="822" y="156" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#9a3412">q_i q_j / (4πε₀ r_ij)</text>
  <text x="822" y="176" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Partial charges &amp;</text>
  <text x="822" y="192" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">hydrogen bonds</text>

  <!-- 5. Van der Waals -->
  <rect x="584" y="220" width="338" height="108" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="753" y="242" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#c2410c">van der Waals (Lennard-Jones 12–6)</text>
  <circle cx="622" cy="284" r="22" fill="#fde68a" fill-opacity="0.45" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="622" cy="284" r="9" fill="#475569"/>
  <circle cx="676" cy="284" r="22" fill="#fde68a" fill-opacity="0.45" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="676" cy="284" r="9" fill="#475569"/>
  <text x="814" y="272" text-anchor="middle" font-family="monospace" font-size="10.2" font-weight="700" fill="#9a3412">ε [(σ/r)¹² − 2(σ/r)⁶]</text>
  <text x="814" y="292" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#475569">Steric clash repulsion</text>
  <text x="814" y="308" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#475569">+ weak dispersion attraction</text>

  <!-- Footer wrapped cleanly onto 2 centered lines -->
  <text x="480" y="368" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">Each force field (e.g. AMBER, CHARMM, GROMOS) defines specific parameters for every atom type —</text>
  <text x="480" y="386" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">treating atoms classically (without explicit electrons) so we can simulate millions of atoms over time.</text>
</svg>

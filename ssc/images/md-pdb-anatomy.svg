<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260" role="img" aria-label="Anatomy of a PDB file ATOM record showing columns for record type, serial, atom name, residue name, chain, residue number, X Y Z coordinates, and element">
  <rect width="920" height="260" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="460" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">What Does a .pdb File Actually Look Like? (ATOM Record Columns)</text>

  <!-- Code bar -->
  <rect x="28" y="106" width="864" height="50" rx="8" fill="#0f172a"/>

  <!-- Highlight boxes behind fields -->
  <rect x="42" y="114" width="60" height="34" rx="5" fill="#1e3a8a"/>
  <rect x="108" y="114" width="68" height="34" rx="5" fill="#14532d"/>
  <rect x="182" y="114" width="46" height="34" rx="5" fill="#581c87"/>
  <rect x="234" y="114" width="54" height="34" rx="5" fill="#9a3412"/>
  <rect x="294" y="114" width="28" height="34" rx="5" fill="#831843"/>
  <rect x="328" y="114" width="46" height="34" rx="5" fill="#0e7490"/>
  <rect x="384" y="114" width="270" height="34" rx="5" fill="#b45309"/>
  <rect x="664" y="114" width="136" height="34" rx="5" fill="#334155"/>
  <rect x="810" y="114" width="60" height="34" rx="5" fill="#065f46"/>

  <!-- Monospace ATOM line -->
  <text x="72" y="137" text-anchor="middle" font-family="monospace" font-size="15.5" font-weight="700" fill="#93c5fd">ATOM</text>
  <text x="142" y="137" text-anchor="middle" font-family="monospace" font-size="15.5" font-weight="700" fill="#86efac">5</text>
  <text x="205" y="137" text-anchor="middle" font-family="monospace" font-size="15.5" font-weight="700" fill="#e9d5ff">CA</text>
  <text x="261" y="137" text-anchor="middle" font-family="monospace" font-size="15.5" font-weight="700" fill="#fed7aa">ALA</text>
  <text x="308" y="137" text-anchor="middle" font-family="monospace" font-size="15.5" font-weight="700" fill="#fbcfe8">A</text>
  <text x="351" y="137" text-anchor="middle" font-family="monospace" font-size="15.5" font-weight="700" fill="#a5f3fc">1</text>
  <text x="519" y="137" text-anchor="middle" font-family="monospace" font-size="15.5" font-weight="700" fill="#fef3c7">-34.817  -23.426   -2.296</text>
  <text x="732" y="137" text-anchor="middle" font-family="monospace" font-size="14.5" fill="#94a3b8">1.00   0.00</text>
  <text x="840" y="137" text-anchor="middle" font-family="monospace" font-size="15.5" font-weight="700" fill="#6ee7b7">C</text>

  <!-- Top callouts -->
  <line x1="72" y1="112" x2="72" y2="78" stroke="#2563eb" stroke-width="2"/>
  <text x="72" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">1. Record</text>
  <text x="72" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">ATOM / HETATM</text>

  <line x1="205" y1="112" x2="205" y2="78" stroke="#7c3aed" stroke-width="2"/>
  <text x="205" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">3. Atom Name</text>
  <text x="205" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">e.g. N, CA, C, O</text>

  <line x1="308" y1="112" x2="308" y2="78" stroke="#be185d" stroke-width="2"/>
  <text x="308" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9d174d">5. Chain</text>
  <text x="308" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">Subunit ID</text>

  <line x1="519" y1="112" x2="519" y2="78" stroke="#d97706" stroke-width="2"/>
  <text x="519" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#b45309">7–9. X, Y, Z Coordinates (Ångströms)</text>
  <text x="519" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">3D position of this atom in space (1 Å = 0.1 nm)</text>

  <line x1="840" y1="112" x2="840" y2="78" stroke="#059669" stroke-width="2"/>
  <text x="840" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#047857">Element</text>
  <text x="840" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">C, N, O, H, S</text>

  <!-- Bottom callouts -->
  <line x1="142" y1="150" x2="142" y2="190" stroke="#16a34a" stroke-width="2"/>
  <text x="142" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">2. Serial #</text>
  <text x="142" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">Atom index</text>

  <polyline points="261,150 261,170 250,190" fill="none" stroke="#ea580c" stroke-width="2"/>
  <text x="250" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#c2410c">4. Residue</text>
  <text x="250" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" fill="#475569">3-letter AA (ALA)</text>

  <polyline points="351,150 351,170 374,190" fill="none" stroke="#0891b2" stroke-width="2"/>
  <text x="374" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#0e7490">6. Res #</text>
  <text x="374" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" fill="#475569">Sequence pos.</text>

  <line x1="732" y1="150" x2="732" y2="190" stroke="#64748b" stroke-width="2"/>
  <text x="732" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Occupancy &amp; B-factor</text>
  <text x="732" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#64748b">(Experimental metadata)</text>

  <text x="460" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#64748b">Every Protein Data Bank (.pdb) file is plain text — one line per atom giving its chemical identity and 3D coordinates.</text>
</svg>

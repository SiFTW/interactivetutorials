<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 264" width="960" height="264" role="img" aria-label="Three inputs (Steady State and Time Course) for TLR, BCR, and NIK in the NF-kB Tri-Model">
  <rect width="960" height="264" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="480" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a">3 Signalling Inputs — Each Has a Steady State (Phase 1) &amp; Time Course (Phase 2)</text>

  <!-- Card 1: TLR -->
  <rect x="22" y="48" width="292" height="194" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="168" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#14532d">1. TLR (e.g. CpG / LPS)</text>
  <!-- SS mini plot -->
  <text x="95" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="600" fill="#475569">Steady State</text>
  <line x1="48" y1="168" x2="142" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="48" y1="104" x2="48" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="50" y1="162" x2="140" y2="162" stroke="#16a34a" stroke-width="2.5"/>
  <text x="95" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" fill="#166534">Basal (0)</text>
  <!-- TC mini plot -->
  <text x="241" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="600" fill="#475569">Time Course</text>
  <line x1="194" y1="168" x2="288" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="194" y1="104" x2="194" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 196 164 Q 210 108 232 134 T 286 164" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="241" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" fill="#166534">Transient CpG pulse</text>
  <text x="168" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">Mutated in WM: MYD88 L265P</text>

  <!-- Card 2: BCR -->
  <rect x="334" y="48" width="292" height="194" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
  <text x="480" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#831843">2. BCR (Chronic in U-CLL)</text>
  <!-- SS mini plot -->
  <text x="407" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="600" fill="#475569">Steady State</text>
  <line x1="360" y1="168" x2="454" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="360" y1="104" x2="360" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="362" y1="120" x2="452" y2="120" stroke="#be185d" stroke-width="2.8"/>
  <line x1="362" y1="154" x2="452" y2="154" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="407" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.6" fill="#831843">U-CLL high / M-CLL low</text>
  <!-- TC mini plot -->
  <text x="553" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="600" fill="#475569">Time Course</text>
  <line x1="506" y1="168" x2="600" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="506" y1="104" x2="506" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="508" y1="120" x2="598" y2="120" stroke="#be185d" stroke-width="2.8"/>
  <line x1="508" y1="154" x2="598" y2="154" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="553" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.6" fill="#831843">Maintained basal BCR</text>
  <text x="480" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">bcrSignalSSHigh vs bcrSignalSS</text>

  <!-- Card 3: NIK -->
  <rect x="646" y="48" width="292" height="194" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="792" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#1e3a8a">3. NIK (Non-Canonical)</text>
  <!-- SS mini plot -->
  <text x="719" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="600" fill="#475569">Steady State</text>
  <line x1="672" y1="168" x2="766" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="672" y1="104" x2="672" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="674" y1="138" x2="764" y2="138" stroke="#2563eb" stroke-width="2.5"/>
  <text x="719" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" fill="#1d4ed8">Basal NIK (1.0)</text>
  <!-- TC mini plot -->
  <text x="865" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="600" fill="#475569">Time Course</text>
  <line x1="818" y1="168" x2="912" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="818" y1="104" x2="818" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="820" y1="138" x2="910" y2="138" stroke="#2563eb" stroke-width="2.5"/>
  <text x="865" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.6" fill="#1d4ed8">Constant or BAFF/CD40</text>
  <text x="792" y="220" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">Drives p100 → p52 &amp; RelB:p52</text>
</svg>

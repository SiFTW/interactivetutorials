<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="Three inputs (Steady State and Time Course) for TLR, BCR, and NIK in the NF-kB Tri-Model">
  <rect width="880" height="260" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="440" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">3 Signalling Inputs — Each Has a Steady State (Phase 1) &amp; Time Course (Phase 2)</text>

  <!-- Card 1: TLR -->
  <rect x="24" y="48" width="264" height="190" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="156" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#14532d">1. TLR (e.g. CpG / LPS)</text>
  <!-- SS mini plot -->
  <text x="86" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Steady State</text>
  <line x1="42" y1="168" x2="132" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="42" y1="104" x2="42" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="44" y1="162" x2="130" y2="162" stroke="#16a34a" stroke-width="2.5"/>
  <text x="86" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Basal (0)</text>
  <!-- TC mini plot -->
  <text x="224" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Time Course</text>
  <line x1="176" y1="168" x2="270" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="176" y1="104" x2="176" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 178 164 Q 192 108 214 134 T 268 164" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="224" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Transient CpG pulse</text>
  <text x="156" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">Mutated in WM: MYD88 L265P</text>

  <!-- Card 2: BCR -->
  <rect x="308" y="48" width="264" height="190" rx="12" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
  <text x="440" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#831843">2. BCR (Chronic in U-CLL)</text>
  <!-- SS mini plot -->
  <text x="370" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Steady State</text>
  <line x1="326" y1="168" x2="416" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="326" y1="104" x2="326" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="328" y1="120" x2="414" y2="120" stroke="#be185d" stroke-width="2.8"/>
  <line x1="328" y1="154" x2="414" y2="154" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="370" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#831843">U-CLL high / M-CLL low</text>
  <!-- TC mini plot -->
  <text x="508" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Time Course</text>
  <line x1="460" y1="168" x2="554" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="460" y1="104" x2="460" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="462" y1="120" x2="552" y2="120" stroke="#be185d" stroke-width="2.8"/>
  <line x1="462" y1="154" x2="552" y2="154" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="508" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#831843">Maintained basal BCR</text>
  <text x="440" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">bcrSignalSSHigh vs bcrSignalSS</text>

  <!-- Card 3: NIK -->
  <rect x="592" y="48" width="264" height="190" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="724" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">3. NIK (Non-Canonical)</text>
  <!-- SS mini plot -->
  <text x="654" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Steady State</text>
  <line x1="610" y1="168" x2="700" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="610" y1="104" x2="610" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="612" y1="138" x2="698" y2="138" stroke="#2563eb" stroke-width="2.5"/>
  <text x="654" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1d4ed8">Basal NIK (1.0)</text>
  <!-- TC mini plot -->
  <text x="792" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569">Time Course</text>
  <line x1="744" y1="168" x2="838" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="744" y1="104" x2="744" y2="168" stroke="#64748b" stroke-width="1.5"/>
  <line x1="746" y1="138" x2="836" y2="138" stroke="#2563eb" stroke-width="2.5"/>
  <text x="792" y="184" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1d4ed8">Constant or BAFF/CD40</text>
  <text x="724" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">Drives p100 → p52 &amp; RelB:p52</text>
</svg>

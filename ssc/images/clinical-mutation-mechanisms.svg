<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 364" width="1000" height="364" role="img" aria-label="Three distinct biophysical mechanisms of clinical missense mutations: MYD88 L265P, Haemoglobin E6V, and Proinsulin C96Y">
  <rect width="1000" height="364" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="500" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Three Clinical Missense Mutations: Why Structural Context &amp; Dynamics Matter</text>

  <!-- Card 1: MYD88 L265P -->
  <rect x="22" y="54" width="308" height="288" rx="11" fill="#fdf2f8" stroke="#be185d" stroke-width="1.8"/>
  <rect x="22" y="54" width="308" height="34" rx="11" fill="#be185d"/>
  <text x="176" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1. MYD88 L265P (UniProt L252P)</text>
  <text x="176" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#9d174d">Waldenström Macroglobulinemia / DLBCL</text>

  <rect x="34" y="120" width="284" height="30" rx="6" fill="#ffffff" stroke="#f9a8d4" stroke-width="1.3"/>
  <text x="176" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.8" font-weight="700" fill="#be185d">AlphaMissense: 0.997 (Likely Pathogenic)</text>

  <text x="38" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Structural Location:</text>
  <text x="38" y="191" font-family="system-ui, -apple-system, sans-serif" font-size="10.6" fill="#334155">Buried hydrophobic core of the βD-strand</text>
  <text x="38" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="10.6" fill="#334155">(pLDDT 88.1 — confident folded core).</text>

  <text x="38" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Biophysical Mechanism:</text>
  <text x="38" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="10.6" fill="#334155">Leu → rigid Proline kinks the backbone,</text>
  <text x="38" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="10.6" fill="#334155">allosterically unlocking the BB-loop for</text>
  <text x="38" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="10.6" fill="#334155">spontaneous TIR–TIR self-assembly.</text>
  <text x="38" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" font-weight="700" fill="#9d174d">→ Gain-of-function (constitutive NF-κB)</text>

  <!-- Card 2: Haemoglobin E6V -->
  <rect x="346" y="54" width="308" height="288" rx="11" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <rect x="346" y="54" width="308" height="34" rx="11" fill="#d97706"/>
  <text x="500" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" font-weight="700" fill="#ffffff">2. Haemoglobin β E6V (UniProt E7V)</text>
  <text x="500" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="700" fill="#92400e">Sickle-Cell Disease (HbS)</text>

  <rect x="358" y="120" width="284" height="30" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.3"/>
  <text x="500" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.8" font-weight="700" fill="#b45309">AlphaMissense: 0.223 ("Likely Benign")</text>

  <text x="362" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Structural Location:</text>
  <text x="362" y="191" font-family="system-ui, -apple-system, sans-serif" font-size="10.6" fill="#334155">Solvent-exposed outer surface of helix A</text>
  <text x="362" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="10.6" fill="#334155">(monomer fold stays completely intact).</text>

  <text x="362" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Why AI Misses It (Key Lesson):</text>
  <text x="362" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#334155">Charged Glu → sticky hydrophobic Val only</text>
  <text x="362" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#334155">causes harm when deoxygenated tetramers</text>
  <text x="362" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#334155">polymerise into rigid sickle fibres.</text>
  <text x="362" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#b45309">→ Quaternary aggregation (AI blind spot)</text>

  <!-- Card 3: Proinsulin C96Y -->
  <rect x="670" y="54" width="308" height="288" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="670" y="54" width="308" height="34" rx="11" fill="#2563eb"/>
  <text x="824" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3. Proinsulin C96Y (Akita)</text>
  <text x="824" y="108" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="700" fill="#1e40af">Neonatal Diabetes (MIDY)</text>

  <rect x="682" y="120" width="284" height="30" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="824" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.8" font-weight="700" fill="#1d4ed8">AlphaMissense: 0.998 (Likely Pathogenic)</text>

  <text x="686" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Structural Location:</text>
  <text x="686" y="191" font-family="system-ui, -apple-system, sans-serif" font-size="10.6" fill="#334155">Conserved Cys96 forming an essential</text>
  <text x="686" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="10.6" fill="#334155">inter-chain disulphide bridge to Cys31.</text>

  <text x="686" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Biophysical Mechanism:</text>
  <text x="686" y="253" font-family="system-ui, -apple-system, sans-serif" font-size="10.6" fill="#334155">Cys → bulky aromatic Tyr abolishes the</text>
  <text x="686" y="269" font-family="system-ui, -apple-system, sans-serif" font-size="10.6" fill="#334155">covalent S–S bridge, causing proinsulin</text>
  <text x="686" y="285" font-family="system-ui, -apple-system, sans-serif" font-size="10.6" fill="#334155">misfolding, ER stress, and β-cell death.</text>
  <text x="686" y="316" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" font-weight="700" fill="#1e40af">→ Fold destabilisation &amp; proteotoxicity</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="Canonical versus Non-Canonical NF-kB signalling pathways">
  <defs>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect width="860" height="360" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left panel: Canonical -->
  <rect x="24" y="20" width="390" height="320" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="219" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#14532d">Canonical Pathway</text>
  <text x="219" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#166534">Triggers: BCR, TLR (e.g. CpG, LPS)</text>

  <rect x="114" y="90" width="210" height="44" rx="10" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <text x="219" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">IKKα / IKKβ / NEMO</text>

  <line x1="219" y1="136" x2="219" y2="168" stroke="#15803d" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="232" y="158" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#166534">Degrades IκBα/β/ε</text>

  <rect x="109" y="176" width="220" height="44" rx="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="219" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#713f12">Releases RelA:p50 &amp; cRel:p50</text>

  <line x1="219" y1="222" x2="219" y2="254" stroke="#15803d" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="232" y="244" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#166534">Enters Nucleus</text>

  <rect x="74" y="262" width="290" height="58" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="219" y="287" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#14532d">RelAnp50n &amp; cRelnp50n on DNA</text>
  <text x="219" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">Rapid response: survival, proliferation, IκBα, A20</text>

  <!-- Right panel: Non-Canonical -->
  <rect x="446" y="20" width="390" height="320" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="641" y="50" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">Non-Canonical Pathway</text>
  <text x="641" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1d4ed8">Triggers: BAFF, CD40 (via NIK)</text>

  <rect x="536" y="90" width="210" height="44" rx="10" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
  <text x="641" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">NIK / IKKα / IKKα</text>

  <line x1="641" y1="136" x2="641" y2="168" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="654" y="158" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">Processes p100 → p52</text>

  <rect x="531" y="176" width="220" height="44" rx="10" fill="#fbcfe8" stroke="#be185d" stroke-width="2"/>
  <text x="641" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#831843">Generates active RelB:p52</text>

  <line x1="641" y1="222" x2="641" y2="254" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrBlue)"/>
  <text x="654" y="244" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">Enters Nucleus</text>

  <rect x="496" y="262" width="290" height="58" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="641" y="287" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">RelBnp52n on DNA</text>
  <text x="641" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" fill="#334155">Slow, sustained B-cell survival &amp; crosstalk</text>
</svg>

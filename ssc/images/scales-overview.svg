<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="920" height="280" role="img" aria-label="Modelling across biological scales: Molecular Dynamics, Signalling and Cancer, and Populations">
  <defs>
    <marker id="arrowScale" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <linearGradient id="gradMol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="gradCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="gradPop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
  </defs>

  <rect width="920" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Scale arrow at top -->
  <line x1="90" y1="38" x2="830" y2="38" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowScale)"/>
  <text x="460" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Spatial &amp; Temporal Scale (Nanometres / Nanoseconds → Kilometres / Years)</text>

  <!-- Card 1: Molecular Dynamics -->
  <rect x="30" y="64" width="260" height="190" rx="12" fill="url(#gradMol)" stroke="#0284c7" stroke-width="2"/>
  <text x="160" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#0c4a6e">Molecular Dynamics</text>
  <text x="160" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#0369a1">Weeks 2–3 · Atoms &amp; Proteins</text>
  <!-- Simple protein ribbon / atom glyph -->
  <circle cx="118" cy="160" r="10" fill="#0284c7"/>
  <circle cx="152" cy="146" r="8" fill="#38bdf8"/>
  <circle cx="186" cy="164" r="11" fill="#0369a1"/>
  <circle cx="204" cy="144" r="7" fill="#0ea5e9"/>
  <line x1="127" y1="156" x2="145" y2="149" stroke="#0c4a6e" stroke-width="2.5"/>
  <line x1="159" y1="150" x2="177" y2="160" stroke="#0c4a6e" stroke-width="2.5"/>
  <line x1="194" y1="157" x2="200" y2="149" stroke="#0c4a6e" stroke-width="2.5"/>
  <text x="160" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1e293b">How do drugs &amp; mutations</text>
  <text x="160" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1e293b">change protein shape &amp; binding?</text>
  <text x="160" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#0369a1">~10⁻⁹ m · 10⁻⁹ s</text>

  <!-- Connector 1 -> 2 -->
  <line x1="296" y1="158" x2="324" y2="158" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowScale)"/>

  <!-- Card 2: Signalling & Cancer -->
  <rect x="330" y="64" width="260" height="190" rx="12" fill="url(#gradCell)" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#4c1d95">Signalling &amp; Cancer</text>
  <text x="460" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#6d28d9">Weeks 4–5 · Cells &amp; Pathways</text>
  <!-- Simple pathway nodes -->
  <rect x="378" y="146" width="42" height="24" rx="6" fill="#7c3aed"/>
  <text x="399" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">IKK</text>
  <line x1="422" y1="158" x2="442" y2="158" stroke="#4c1d95" stroke-width="2" marker-end="url(#arrowScale)"/>
  <rect x="444" y="146" width="44" height="24" rx="6" fill="#a855f7"/>
  <text x="466" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">IκB</text>
  <line x1="490" y1="158" x2="508" y2="158" stroke="#4c1d95" stroke-width="2"/>
  <line x1="508" y1="151" x2="508" y2="165" stroke="#4c1d95" stroke-width="2.5"/>
  <rect x="514" y="146" width="46" height="24" rx="6" fill="#5b21b6"/>
  <text x="537" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">NF-κB</text>
  <text x="460" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1e293b">How do biochemical networks</text>
  <text x="460" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1e293b">control cell fate &amp; therapy response?</text>
  <text x="460" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#6d28d9">~10⁻⁵ m · minutes–days</text>

  <!-- Connector 2 -> 3 -->
  <line x1="596" y1="158" x2="624" y2="158" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowScale)"/>

  <!-- Card 3: Populations (Active Week 1 highlight) -->
  <rect x="630" y="64" width="260" height="190" rx="12" fill="url(#gradPop)" stroke="#15803d" stroke-width="3"/>
  <rect x="688" y="54" width="144" height="20" rx="10" fill="#15803d"/>
  <text x="760" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">START HERE · WEEK 1</text>
  <text x="760" y="96" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#14532d">Populations</text>
  <text x="760" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#166534">Week 1 · Epidemics &amp; Public Health</text>
  <!-- Mini epidemic wave glyph -->
  <path d="M 672 174 Q 716 174 734 144 T 784 166 T 844 174" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  <path d="M 672 142 Q 722 142 752 164 T 844 174" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5,3"/>
  <line x1="668" y1="176" x2="848" y2="176" stroke="#14532d" stroke-width="1.5"/>
  <text x="760" y="206" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1e293b">How do infectious diseases spread</text>
  <text x="760" y="224" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#1e293b">&amp; respond to public health action?</text>
  <text x="760" y="244" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#166534">~10⁶ people · days–years</text>
</svg>

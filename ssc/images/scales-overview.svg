<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 286" width="940" height="286" role="img" aria-label="Modelling across biological scales: Molecular Dynamics, Signalling and Cancer, and Populations">
  <defs>
    <marker id="arrowScale" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <linearGradient id="gradMol" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="gradCell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="gradPop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
  </defs>

  <rect width="940" height="286" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Scale arrow at top -->
  <line x1="84" y1="38" x2="856" y2="38" stroke="#475569" stroke-width="2.5" marker-end="url(#arrowScale)"/>
  <text x="470" y="25" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Spatial &amp; Temporal Scale (Nanometres / Nanoseconds → Kilometres / Years)</text>

  <!-- Card 1: Molecular Dynamics -->
  <rect x="24" y="66" width="274" height="194" rx="12" fill="url(#gradMol)" stroke="#0284c7" stroke-width="2"/>
  <text x="161" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#0c4a6e">Molecular Dynamics</text>
  <text x="161" y="121" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" font-weight="600" fill="#0369a1">Weeks 2–3 · Atoms &amp; Proteins</text>
  <circle cx="119" cy="161" r="10" fill="#0284c7"/>
  <circle cx="153" cy="147" r="8" fill="#38bdf8"/>
  <circle cx="187" cy="165" r="11" fill="#0369a1"/>
  <circle cx="205" cy="145" r="7" fill="#0ea5e9"/>
  <line x1="128" y1="157" x2="146" y2="150" stroke="#0c4a6e" stroke-width="2.5"/>
  <line x1="160" y1="151" x2="178" y2="161" stroke="#0c4a6e" stroke-width="2.5"/>
  <line x1="195" y1="158" x2="201" y2="150" stroke="#0c4a6e" stroke-width="2.5"/>
  <text x="161" y="208" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" fill="#1e293b">How do drugs &amp; mutations</text>
  <text x="161" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" fill="#1e293b">change protein shape &amp; binding?</text>
  <text x="161" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0369a1">~10⁻⁹ m · 10⁻⁹ s</text>

  <!-- Connector 1 -> 2 -->
  <line x1="303" y1="162" x2="328" y2="162" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowScale)"/>

  <!-- Card 2: Signalling & Cancer -->
  <rect x="333" y="66" width="274" height="194" rx="12" fill="url(#gradCell)" stroke="#7c3aed" stroke-width="2"/>
  <text x="470" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#4c1d95">Signalling &amp; Cancer</text>
  <text x="470" y="121" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" font-weight="600" fill="#6d28d9">Weeks 4–5 · Cells &amp; Pathways</text>
  <rect x="378" y="147" width="44" height="24" rx="6" fill="#7c3aed"/>
  <text x="400" y="163" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">IKK</text>
  <line x1="424" y1="159" x2="444" y2="159" stroke="#4c1d95" stroke-width="2" marker-end="url(#arrowScale)"/>
  <rect x="446" y="147" width="44" height="24" rx="6" fill="#a855f7"/>
  <text x="468" y="163" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">IκB</text>
  <line x1="492" y1="159" x2="508" y2="159" stroke="#4c1d95" stroke-width="2"/>
  <line x1="508" y1="152" x2="508" y2="166" stroke="#4c1d95" stroke-width="2.5"/>
  <rect x="514" y="147" width="56" height="24" rx="6" fill="#5b21b6"/>
  <text x="542" y="163" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">NF-κB</text>
  <text x="470" y="208" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" fill="#1e293b">How do biochemical networks</text>
  <text x="470" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#1e293b">control cell fate &amp; therapy response?</text>
  <text x="470" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6d28d9">~10⁻⁵ m · minutes–days</text>

  <!-- Connector 2 -> 3 -->
  <line x1="612" y1="162" x2="637" y2="162" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowScale)"/>

  <!-- Card 3: Populations (Active Week 1 highlight) -->
  <rect x="642" y="66" width="274" height="194" rx="12" fill="url(#gradPop)" stroke="#15803d" stroke-width="3"/>
  <rect x="691" y="54" width="176" height="22" rx="11" fill="#15803d"/>
  <text x="779" y="69" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff">START HERE · WEEK 1</text>
  <text x="779" y="98" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#14532d">Populations</text>
  <text x="779" y="121" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" font-weight="600" fill="#166534">Week 1 · Epidemics &amp; Public Health</text>
  <path d="M 691 175 Q 735 175 753 145 T 803 167 T 863 175" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
  <path d="M 691 143 Q 741 143 771 165 T 863 175" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5,3"/>
  <line x1="687" y1="177" x2="867" y2="177" stroke="#14532d" stroke-width="1.5"/>
  <text x="779" y="208" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" fill="#1e293b">How do infectious diseases spread</text>
  <text x="779" y="226" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" fill="#1e293b">&amp; respond to public health action?</text>
  <text x="779" y="246" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#166534">~10⁶ people · days–years</text>
</svg>

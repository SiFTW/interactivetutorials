<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 338" width="1000" height="338" role="img" aria-label="AlphaFold to Molecular Dynamics clinical workflow from patient variant to cellular signalling">
  <defs>
    <marker id="arrPipe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1000" height="338" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="500" y="32" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">From AI Structure Prediction to Physics-Based Dynamics (AlphaFold → OpenMM MD)</text>

  <!-- Step 1: Patient Variant -->
  <rect x="22" y="62" width="174" height="150" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="22" y="62" width="174" height="30" rx="10" fill="#dc2626"/>
  <text x="109" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">1. Clinical Variant</text>
  <text x="109" y="114" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#991b1b">DNA Sequencing</text>
  <text x="109" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7f1d1d">e.g. MYD88 L265P</text>
  <text x="109" y="154" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#7f1d1d">(UniProt L252P)</text>
  <text x="109" y="179" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" fill="#991b1b">98% of Waldenström</text>
  <text x="109" y="194" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" fill="#991b1b">Macroglobulinemia</text>

  <line x1="196" y1="137" x2="220" y2="137" stroke="#475569" stroke-width="2.2" marker-end="url(#arrPipe)"/>

  <!-- Step 2: AlphaFold DB & AlphaMissense -->
  <rect x="224" y="62" width="224" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <rect x="224" y="62" width="224" height="30" rx="10" fill="#2563eb"/>
  <text x="336" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="700" fill="#ffffff">2. AlphaFold + AlphaMissense</text>
  <text x="336" y="113" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#1e3a8a">Static 3D Snapshot (AI)</text>
  <text x="336" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#1e40af">• 3D atomic coordinates (.pdb)</text>
  <text x="336" y="153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#1e40af">• pLDDT confidence (0–100)</text>
  <text x="336" y="171" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#1e40af">• PAE domain packing map</text>
  <text x="336" y="189" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#1e40af">• AlphaMissense score (0–1)</text>

  <line x1="448" y1="137" x2="472" y2="137" stroke="#475569" stroke-width="2.2" marker-end="url(#arrPipe)"/>

  <!-- Step 3: In-Silico Mutagenesis & Prep -->
  <rect x="476" y="62" width="234" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="476" y="62" width="234" height="30" rx="10" fill="#16a34a"/>
  <text x="593" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" font-weight="700" fill="#ffffff">3. OpenMM MD (Physics)</text>
  <text x="593" y="113" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#14532d">Dynamic Behaviour Over Time</text>
  <text x="593" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#166534">• Mutate WT → L252P in silico</text>
  <text x="593" y="153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#166534">• Add hydrogens + force field</text>
  <text x="593" y="171" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#166534">• Energy minimise &amp; heat (300 K)</text>
  <text x="593" y="189" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#166534">• Measure RMSF, kinks &amp; loops</text>

  <line x1="710" y1="137" x2="734" y2="137" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arrTeal)"/>

  <!-- Step 4: Link to Week 4 ODE Model -->
  <rect x="738" y="62" width="240" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <rect x="738" y="62" width="240" height="30" rx="10" fill="#7c3aed"/>
  <text x="858" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" font-weight="700" fill="#ffffff">4. Cellular Scale (Week 4)</text>
  <text x="858" y="113" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" font-weight="700" fill="#4c1d95">Signalling &amp; Drug Discovery</text>
  <text x="858" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#5b21b6">• TIR oligomerisation unlocked</text>
  <text x="858" y="153" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#5b21b6">• Constitutive MYD88* active</text>
  <text x="858" y="171" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#5b21b6">• ODE: MYD88 self-activation = 1</text>
  <text x="858" y="189" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.4" fill="#5b21b6">• Screen NF-κB lymphoma drugs</text>

  <!-- Bottom teaching banner -->
  <rect x="22" y="232" width="956" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Why We Need Both AI (AlphaFold) and Physics (MD)</text>
  <text x="500" y="278" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#334155">AlphaFold gives a fast, accurate static 3D starting point when no crystal structure exists — but cannot simulate thermal motion or loop switches.</text>
  <text x="500" y="298" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#334155">Molecular Dynamics brings that prediction to life with Newton's laws, revealing how clinical mutations reshape flexibility and function.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 352" width="940" height="352" role="img" aria-label="Molecular dynamics simulation loop solving Newton's equations iteratively, thermodynamic ensembles NVE NVT NPT, and periodic boundary conditions">
  <defs>
    <marker id="arrMd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrBlueMd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="940" height="352" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="470" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">How an MD Simulation Works: Newton's Loop, Ensembles &amp; Periodic Boundaries</text>

  <!-- Left panel: Iterative MD Loop -->
  <rect x="22" y="48" width="538" height="280" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="291" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Iterative Time-Stepping (Δt ≈ 2 femtoseconds)</text>

  <!-- Step 1 -->
  <rect x="40" y="92" width="224" height="68" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="152" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.2" font-weight="700" fill="#0c4a6e">1. Initial Positions r(t)</text>
  <text x="152" y="136" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#0369a1">Load 3D coordinates (.pdb)</text>
  <text x="152" y="151" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#0369a1">&amp; minimise steric clashes</text>

  <line x1="266" y1="126" x2="312" y2="126" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrMd)"/>

  <!-- Step 2 -->
  <rect x="318" y="92" width="224" height="68" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="430" y="116" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.2" font-weight="700" fill="#9a3412">2. Compute Forces F</text>
  <text x="430" y="136" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#c2410c">F = −∇V(r)</text>
  <text x="430" y="151" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#9a3412">from Force Field parameters</text>

  <line x1="430" y1="162" x2="430" y2="206" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrMd)"/>

  <!-- Step 3 -->
  <rect x="318" y="212" width="224" height="72" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="430" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" font-weight="700" fill="#4c1d95">3. Integrate Newton's Law</text>
  <text x="430" y="256" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#6d28d9">m · d²r/dt² = F</text>
  <text x="430" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#5b21b6">Advance positions by Δt (2 fs)</text>

  <line x1="316" y1="248" x2="270" y2="248" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrMd)"/>

  <!-- Step 4 -->
  <rect x="40" y="212" width="224" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="152" y="236" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.8" font-weight="700" fill="#14532d">4. Save Trajectory &amp; Stats</text>
  <text x="152" y="256" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#166534">Write .dcd movie frame</text>
  <text x="152" y="274" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#166534">Log T (300 K), P, Energy</text>

  <!-- Loop arrow back to Step 2 -->
  <path d="M 152 210 L 152 182 L 384 182 L 384 165" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrBlueMd)"/>
  <text x="268" y="176" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0284c7">Repeat 100,000+ times (t → t + Δt)</text>

  <text x="291" y="313" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Δt too small → too slow   ·   Δt too big → atoms collide &amp; simulation explodes</text>

  <!-- Right Top: Thermodynamic Ensembles -->
  <rect x="576" y="48" width="342" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="747" y="70" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Thermodynamic Ensembles</text>

  <rect x="588" y="84" width="98" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="637" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#334155">NVE</text>
  <text x="637" y="123" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Isolated</text>
  <text x="637" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Const N, V, E</text>

  <rect x="698" y="84" width="98" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="747" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">NVT</text>
  <text x="747" y="123" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e40af">+ Thermostat</text>
  <text x="747" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1e40af">Const N, V, T</text>

  <rect x="808" y="84" width="98" height="72" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="857" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#15803d">NPT</text>
  <text x="857" y="123" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534">+ Barostat</text>
  <text x="857" y="139" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#166534">Const N, P, T</text>

  <!-- Right Bottom: Periodic Boundary Conditions -->
  <rect x="576" y="182" width="342" height="146" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="747" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Periodic Boundary Conditions (PBC)</text>

  <!-- 3x3 lattice grid -->
  <g transform="translate(600, 216)">
    <rect x="0" y="0" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="32" y="0" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="64" y="0" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="0" y="32" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="32" y="32" width="32" height="32" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="64" y="32" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="0" y="64" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="32" y="64" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="64" y="64" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <circle cx="62" cy="48" r="5" fill="#dc2626"/>
    <line x1="67" y1="48" x2="77" y2="48" stroke="#dc2626" stroke-width="2"/>
    <circle cx="30" cy="48" r="5" fill="#dc2626" fill-opacity="0.45" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="35" y1="48" x2="45" y2="48" stroke="#dc2626" stroke-width="2" stroke-dasharray="2,1"/>
  </g>

  <text x="716" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">Cell tiles infinitely to</text>
  <text x="716" y="257" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">mimic bulk water.</text>
  <text x="716" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">An atom exiting one</text>
  <text x="716" y="299" font-family="system-ui, -apple-system, sans-serif" font-size="11.2" fill="#334155">side re-enters opposite.</text>
</svg>

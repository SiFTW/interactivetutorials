<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350" role="img" aria-label="Molecular dynamics simulation loop solving Newton's equations iteratively, thermodynamic ensembles NVE NVT NPT, and periodic boundary conditions">
  <defs>
    <marker id="arrMd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e293b"/>
    </marker>
    <marker id="arrBlueMd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <rect width="920" height="350" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="460" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">How an MD Simulation Works: Newton's Loop, Ensembles &amp; Periodic Boundaries</text>

  <!-- Left panel: Iterative MD Loop -->
  <rect x="24" y="48" width="530" height="278" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="289" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Iterative Time-Stepping (Δt ≈ 2 femtoseconds)</text>

  <!-- Step 1 -->
  <rect x="44" y="92" width="215" height="68" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="151" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0c4a6e">1. Initial Positions r(t)</text>
  <text x="151" y="136" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#0369a1">Load 3D coordinates (.pdb)</text>
  <text x="151" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0369a1">&amp; minimise steric clashes</text>

  <line x1="261" y1="126" x2="310" y2="126" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrMd)"/>

  <!-- Step 2 -->
  <rect x="316" y="92" width="218" height="68" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="425" y="116" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a3412">2. Compute Forces F</text>
  <text x="425" y="136" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#c2410c">F = −∇V(r)</text>
  <text x="425" y="151" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#9a3412">from Force Field parameters</text>

  <line x1="425" y1="162" x2="425" y2="206" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrMd)"/>

  <!-- Step 3 -->
  <rect x="316" y="212" width="218" height="72" rx="10" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="425" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4c1d95">3. Integrate Newton's Law</text>
  <text x="425" y="256" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#6d28d9">m · d²r/dt² = F</text>
  <text x="425" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5b21b6">Advance positions by Δt (2 fs)</text>

  <line x1="314" y1="248" x2="265" y2="248" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrMd)"/>

  <!-- Step 4 -->
  <rect x="44" y="212" width="215" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="151" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#14532d">4. Save Trajectory &amp; Stats</text>
  <text x="151" y="256" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#166534">Write .dcd movie frame</text>
  <text x="151" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Log T (300 K), P, Energy</text>

  <!-- Loop arrow back to Step 2 -->
  <path d="M 151 210 L 151 182 L 380 182 L 380 165" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrBlueMd)"/>
  <text x="268" y="176" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#0284c7">Repeat 100,000+ times (t → t + Δt)</text>

  <text x="289" y="312" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#475569">Δt too small → too slow   ·   Δt too big → atoms collide &amp; simulation explodes!</text>

  <!-- Right Top: Thermodynamic Ensembles -->
  <rect x="572" y="48" width="324" height="122" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="734" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Thermodynamic Ensembles</text>

  <rect x="586" y="84" width="90" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="631" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">NVE</text>
  <text x="631" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">Isolated</text>
  <text x="631" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">Const N, V, E</text>

  <rect x="689" y="84" width="90" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="734" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">NVT</text>
  <text x="734" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e40af">+ Thermostat</text>
  <text x="734" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e40af">Const N, V, T</text>

  <rect x="792" y="84" width="90" height="72" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="837" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#15803d">NPT</text>
  <text x="837" y="123" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#166534">+ Barostat</text>
  <text x="837" y="139" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#166534">Const N, P, T</text>

  <!-- Right Bottom: Periodic Boundary Conditions -->
  <rect x="572" y="182" width="324" height="144" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="734" y="204" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">Periodic Boundary Conditions (PBC)</text>

  <!-- 3x3 lattice grid -->
  <g transform="translate(596, 214)">
    <rect x="0" y="0" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="32" y="0" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="64" y="0" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="0" y="32" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <!-- Central unit cell -->
    <rect x="32" y="32" width="32" height="32" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="64" y="32" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="0" y="64" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="32" y="64" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <rect x="64" y="64" width="32" height="32" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/>
    <!-- Particle leaving right and entering left -->
    <circle cx="62" cy="48" r="5" fill="#dc2626"/>
    <line x1="67" y1="48" x2="77" y2="48" stroke="#dc2626" stroke-width="2"/>
    <circle cx="30" cy="48" r="5" fill="#dc2626" fill-opacity="0.45" stroke="#dc2626" stroke-width="1.5"/>
    <line x1="35" y1="48" x2="45" y2="48" stroke="#dc2626" stroke-width="2" stroke-dasharray="2,1"/>
  </g>

  <text x="710" y="238" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">Cell tiles infinitely to</text>
  <text x="710" y="255" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">mimic bulk water.</text>
  <text x="710" y="280" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">An atom exiting one</text>
  <text x="710" y="297" font-family="system-ui, sans-serif" font-size="11.5" fill="#334155">side re-enters opposite!</text>
</svg>

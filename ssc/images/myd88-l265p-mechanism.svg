<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="960" height="436" role="img" aria-label="Domain architecture of human MYD88 and structural mechanism of the oncogenic L265P (UniProt L252P) mutation">
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrMag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#be185d"/>
    </marker>
  </defs>

  <rect width="960" height="436" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="480" y="30" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Human MYD88 (UniProt Q99836, 296 aa): Architecture &amp; Oncogenic L265P (L252P) Switch</text>

  <!-- Domain bar -->
  <text x="28" y="64" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#475569">N-term</text>
  <rect x="28" y="72" width="76" height="48" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
  <text x="66" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#9a3412">aa 1–20</text>
  <text x="66" y="109" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#9a3412">pLDDT 45</text>

  <!-- Death Domain -->
  <rect x="110" y="72" width="268" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="244" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">Death Domain (DD) · aa 21–109</text>
  <text x="244" y="109" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#1d4ed8">Recruits IRAK4/IRAK1 · Mean pLDDT 87.4</text>

  <!-- Intermediary Linker -->
  <rect x="384" y="72" width="150" height="48" rx="7" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="459" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#854d0e">Linker · aa 110–155</text>
  <text x="459" y="109" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#a16207">Flexible · pLDDT 70.4</text>

  <!-- TIR Domain -->
  <rect x="540" y="72" width="392" height="48" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2"/>
  <text x="736" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0c4a6e">TIR Domain (Toll / IL-1 Receptor) · aa 156–296</text>
  <text x="736" y="109" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#0369a1">Binds TLRs &amp; self-assembles Myddosome · Mean pLDDT 84.6</text>

  <!-- BB-loop marker cleanly positioned below TIR bar -->
  <line x1="648" y1="120" x2="648" y2="132" stroke="#d97706" stroke-width="1.6"/>
  <rect x="570" y="132" width="156" height="22" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="648" y="147" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#92400e">BB-loop (aa 196–206)</text>

  <!-- L252P pin anchored cleanly on bottom border of TIR domain (no text collision) -->
  <line x1="818" y1="120" x2="818" y2="162" stroke="#be185d" stroke-width="2.4" stroke-dasharray="4,2"/>
  <circle cx="818" cy="120" r="6.5" fill="#db2777" stroke="#ffffff" stroke-width="2"/>
  <rect x="650" y="162" width="282" height="58" rx="8" fill="#fdf2f8" stroke="#be185d" stroke-width="1.8"/>
  <text x="791" y="185" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">Clinical L265P = UniProt L252P</text>
  <text x="791" y="204" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#831843">(+13 aa isoform offset · βD-strand core)</text>

  <!-- Isoform note box on left (2 crisp wrapped lines, generous right margin) -->
  <rect x="28" y="156" width="540" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="44" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Clinical Bioinformatics Pitfall: Isoform Numbering Offset (+13 aa)</text>
  <text x="44" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">Pathology reports use historical RefSeq isoform 1 (309 aa → L265P);</text>
  <text x="44" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#334155">UniProt Q99836, AlphaFold DB &amp; PDB (4EO7 / 7L6W) use canonical 296 aa → L252P.</text>

  <!-- Bottom comparison: Healthy WT vs Oncogenic L265P -->
  <rect x="28" y="238" width="434" height="176" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="245" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#14532d">Wild-Type MYD88 (Leu252 / Clinical Leu265)</text>
  <text x="46" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#166534">• Branched hydrophobic Leu252 packs snugly into the TIR core</text>
  <text x="58" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#166534">(surrounded by Met219, Val221, Leu241, Leu268, Ile271).</text>
  <text x="46" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#166534">• Backbone βD-strand (R251–L252–I253–P254) stays unstrained.</text>
  <text x="46" y="347" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#166534">• Monomeric TIR stays OFF until a pathogen activates a TLR.</text>
  <rect x="52" y="368" width="386" height="28" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="245" y="386" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" font-weight="700" fill="#14532d">Controlled NF-κB pulse only during infection</text>

  <line x1="464" y1="326" x2="494" y2="326" stroke="#be185d" stroke-width="2.6" marker-end="url(#arrMag)"/>

  <rect x="498" y="238" width="434" height="176" rx="10" fill="#fdf2f8" stroke="#be185d" stroke-width="1.8"/>
  <text x="715" y="262" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#9d174d">Oncogenic Mutant (Pro252 / Clinical L265P)</text>
  <text x="516" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#831843">• Rigid Proline ring forms a P252–I253–P254 kink and loses</text>
  <text x="528" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#831843">both bulky hydrophobic packing and its backbone N–H bond.</text>
  <text x="516" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#831843">• Allosterically perturbs the BB-loop (196–206) &amp; CD-loop,</text>
  <text x="528" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="10.8" fill="#831843">lowering the barrier for spontaneous TIR–TIR assembly.</text>
  <rect x="514" y="368" width="402" height="28" rx="6" fill="#fce7f3" stroke="#be185d" stroke-width="1.2"/>
  <text x="715" y="386" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.2" font-weight="700" fill="#9d174d">Constitutive Myddosome → Chronic NF-κB (WM / DLBCL)</text>
</svg>
